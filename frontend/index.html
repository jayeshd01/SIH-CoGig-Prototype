<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sahyog / CoGig - Trusted local services powered by cooperatives. Find verified skilled workers from your local labour cooperative." />
    <title>Sahyog (CoGig) — Cooperative Gig Services Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="padding: 24px; text-align: center; font-family: sans-serif;">
          JavaScript is required to run Sahyog / CoGig.
        </div>
      </noscript>
    </div>

    <script>
      // When opened directly via file:// in Windows File Explorer:
      if (window.location.protocol === 'file:') {
        window.__IS_FILE_PROTOCOL__ = true;
        var renderNotice = function() {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = [
            '<div style="min-height: 100vh; background: #F8F7F4; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: system-ui, -apple-system, sans-serif; box-sizing: border-box;">',
            '  <div style="background: #ffffff; max-width: 620px; width: 100%; border-radius: 20px; padding: 36px; box-shadow: 0 16px 40px rgba(0,0,0,0.08); border: 1px solid #E5E7EB; box-sizing: border-box;">',
            '    <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">',
            '      <div style="width: 46px; height: 46px; background: linear-gradient(135deg, #1B6B3A, #2A8F4F); color: #ffffff; font-size: 24px; font-weight: 900; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(27,107,58,0.25);">S</div>',
            '      <div>',
            '        <h1 style="font-size: 22px; font-weight: 800; color: #1B6B3A; margin: 0;">Sahyog / CoGig Platform</h1>',
            '        <p style="font-size: 12px; color: #6B7280; margin: 2px 0 0;">Cooperative Digital Gig Services Marketplace</p>',
            '      </div>',
            '    </div>',
            '    <div style="background: #FFFBEB; border: 1px solid #FDE68A; border-left: 4px solid #F59E0B; padding: 14px 16px; border-radius: 10px; margin-bottom: 20px;">',
            '      <div style="font-weight: 700; color: #92400E; font-size: 13px; margin-bottom: 4px;">⚠️ Notice: Opened via File Explorer (file:// protocol)</div>',
            '      <div style="font-size: 12.5px; color: #B45309; line-height: 1.5;">Modern React + Vite applications use ES modules, dynamic routing, and API calls that require a local development server. Web browsers block these scripts when opened directly from disk folders.</div>',
            '    </div>',
            '    <h2 style="font-size: 14px; font-weight: 700; color: #1F2937; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">🚀 How to run the application (1 Click):</h2>',
            '    <ol style="margin: 0 0 22px; padding-left: 20px; font-size: 13px; color: #4B5563; line-height: 1.8;">',
            '      <li>Go to the project folder: <strong><code>d:\\CoGig</code></strong></li>',
            '      <li>Double-click <strong><code>start-app.bat</code></strong> (or <strong><code>start-frontend.bat</code></strong>)</li>',
            '      <li>Your browser will automatically open to <strong>http://localhost:5173</strong></li>',
            '    </ol>',
            '    <div style="display: flex; gap: 12px; flex-wrap: wrap;">',
            '      <a href="http://localhost:5173" style="display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; background: #1B6B3A; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 13px; border-radius: 10px; box-shadow: 0 4px 12px rgba(27,107,58,0.25);">Open http://localhost:5173 &rarr;</a>',
            '      <a href="http://localhost:3000/api" target="_blank" style="display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; background: #F3F4F6; color: #374151; text-decoration: none; font-weight: 600; font-size: 13px; border-radius: 10px; border: 1px solid #D1D5DB;">API Status</a>',
            '    </div>',
            '  </div>',
            '</div>'
          ].join('');
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', renderNotice);
        } else {
          renderNotice();
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
